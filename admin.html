<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Gladiator League</title>
  <link rel="stylesheet" href="admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="login-logo">
        <i class="fas fa-shield-halved"></i>
        <h1>Gladiator<span class="gold">League</span></h1>
      </div>
      <h2>Admin Panel</h2>
      <form id="loginForm">
        <input type="password" id="password" placeholder="Enter password" required />
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <p class="login-hint">Default password: <code>gladiator2026</code></p>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="admin-panel" id="adminPanel" style="display: none;">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-shield-halved"></i>
        <span>Gladiator<span class="gold">League</span></span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-section="teams">
          <i class="fas fa-users"></i> Teams
        </a>
        <a href="#" class="nav-item" data-section="fixtures">
          <i class="fas fa-calendar-days"></i> Fixtures & Scores
        </a>
        <a href="#" class="nav-item" data-section="scorers">
          <i class="fas fa-futbol"></i> Goal Scorers
        </a>
        <a href="#" class="nav-item" data-section="settings">
          <i class="fas fa-cog"></i> Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="index.html" class="btn-outline-small" target="_blank">
          <i class="fas fa-external-link"></i> View Site
        </a>
        <button id="logoutBtn" class="btn-outline-small">
          <i class="fas fa-sign-out"></i> Logout
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- TEAMS SECTION -->
      <section class="content-section active" id="teamsSection">
        <div class="section-header">
          <h2><i class="fas fa-users"></i> Manage Teams</h2>
          <button class="btn-primary" id="addTeamBtn">
            <i class="fas fa-plus"></i> Add Team
          </button>
        </div>
        <div class="teams-list" id="teamsList"></div>
      </section>

      <!-- FIXTURES SECTION -->
      <section class="content-section" id="fixturesSection">
        <div class="section-header">
          <h2><i class="fas fa-calendar-days"></i> Fixtures & Scores</h2>
          <button class="btn-primary" id="addFixtureBtn">
            <i class="fas fa-plus"></i> Add Fixture
          </button>
        </div>
        <div class="fixtures-list" id="fixturesList"></div>
      </section>

      <!-- GOAL SCORERS SECTION -->
      <section class="content-section" id="scorersSection">
        <div class="section-header">
          <h2><i class="fas fa-futbol"></i> Goal Scorers</h2>
          <button class="btn-primary" id="addScorerBtn">
            <i class="fas fa-plus"></i> Add Goal Scorer
          </button>
        </div>
        <div class="scorers-list" id="scorersList"></div>
      </section>

      <!-- SETTINGS SECTION -->
      <section class="content-section" id="settingsSection">
        <div class="section-header">
          <h2><i class="fas fa-cog"></i> Tournament Settings</h2>
        </div>
        <form class="settings-form" id="settingsForm">
          <div class="form-group">
            <label>Tournament Start Date</label>
            <input type="date" id="startDate" required />
          </div>
          <div class="form-group">
            <label>Tournament End Date</label>
            <input type="date" id="endDate" required />
          </div>
          <div class="form-group">
            <label>Prize Pool ($)</label>
            <input type="number" id="prizeMoney" placeholder="5000" required />
          </div>
          <div class="form-group">
            <label>Total Teams</label>
            <input type="number" id="totalTeams" placeholder="16" required />
          </div>
          <div class="form-group">
            <label>Total Matches</label>
            <input type="number" id="totalMatches" placeholder="64" required />
          </div>
          <button type="submit" class="btn-primary">
            <i class="fas fa-save"></i> Save Settings
          </button>
        </form>
      </section>

    </main>
  </div>

  <!-- TEAM MODAL -->
  <div class="modal" id="teamModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="teamModalTitle">Add Team</h3>
        <button class="modal-close" onclick="closeModal('teamModal')">&times;</button>
      </div>
      <form id="teamForm">
        <input type="hidden" id="teamId" />
        <div class="form-group">
          <label>Team Name</label>
          <input type="text" id="teamName" placeholder="e.g. Titans FC" required />
        </div>
        <div class="form-group">
          <label>Abbreviation (3 letters)</label>
          <input type="text" id="teamAbbr" placeholder="e.g. TIT" maxlength="3" required />
        </div>
        <div class="form-group">
          <label>Team Color</label>
          <input type="color" id="teamColor" value="#e63946" required />
        </div>
        <div class="form-group">
          <label>Group</label>
          <select id="teamGroup" required>
            <option value="A">Group A</option>
            <option value="B">Group B</option>
            <option value="C">Group C</option>
            <option value="D">Group D</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-outline" onclick="closeModal('teamModal')">Cancel</button>
          <button type="submit" class="btn-primary">Save Team</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FIXTURE MODAL -->
  <div class="modal" id="fixtureModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="fixtureModalTitle">Add Fixture</h3>
        <button class="modal-close" onclick="closeModal('fixtureModal')">&times;</button>
      </div>
      <form id="fixtureForm">
        <input type="hidden" id="fixtureId" />
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="fixtureDate" required />
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="fixtureTime" required />
        </div>
        <div class="form-group">
          <label>Home Team</label>
          <select id="homeTeam" required></select>
        </div>
        <div class="form-group">
          <label>Away Team</label>
          <select id="awayTeam" required></select>
        </div>
        <div class="form-group">
          <label>Venue</label>
          <input type="text" id="fixtureVenue" placeholder="e.g. Gladiator Arena — Pitch 1" required />
        </div>
        <div class="form-group">
          <label>Home Score (leave blank if not played)</label>
          <input type="number" id="homeScore" min="0" placeholder="0" />
        </div>
        <div class="form-group">
          <label>Away Score (leave blank if not played)</label>
          <input type="number" id="awayScore" min="0" placeholder="0" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-outline" onclick="closeModal('fixtureModal')">Cancel</button>
          <button type="submit" class="btn-primary">Save Fixture</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCORER MODAL -->
  <div class="modal" id="scorerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="scorerModalTitle">Add Goal Scorer</h3>
        <button class="modal-close" onclick="closeModal('scorerModal')">&times;</button>
      </div>
      <form id="scorerForm">
        <input type="hidden" id="scorerId" />
        <div class="form-group">
          <label>Player Name</label>
          <input type="text" id="playerName" placeholder="e.g. John Smith" required />
        </div>
        <div class="form-group">
          <label>Team</label>
          <select id="scorerTeam" required></select>
        </div>
        <div class="form-group">
          <label>Goals Scored</label>
          <input type="number" id="goalsScored" min="1" value="1" required />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-outline" onclick="closeModal('scorerModal')">Cancel</button>
          <button type="submit" class="btn-primary">Save Scorer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
